<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style 1.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="d-flex">
  <!-- Sidebar -->
  <nav class="sidebar bg-light p-3">
    <h4 class="text-center fw-bold mb-4">Admin<br>Dashboard</h4>
    <ul class="nav flex-column">
      <li class="nav-item"><a class="nav-link" href="admin 1.html">Dashboard</a></li>
      <li class="nav-item"><a class="nav-link active" href="admin 2.html">Manage Users</a></li>
      <li class="nav-item"><a class="nav-link" href="admin 3.html">Add Destination</a></li>
      <li class="nav-item"><a class="nav-link" href="admin 4.html">View Bookings</a></li>
      <li class="nav-item"><a class="nav-link" href="admin 5.html">Gallery</a></li>
      <li class="nav-item"><a class="nav-link" href="admin 6.html">Contact Messages</a></li>
      <li class="nav-item"><a class="nav-link" href="admin 7.html">Settings / Logout</a></li>
    </ul>
  </nav>
  <div class="flex-grow-1">
    <header class="bg-light shadow-sm p-3 mb-4">
      <h5 class="mb-0">Welcome, Admin</h5>
    </header>

    <div class="container-fluid">
      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <div class="card text-center shadow-sm">
            <div class="card-body">
              <h6 class="card-title">Total Bookings</h6>
              <h2 class="fw-bold">67</h2>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card text-center shadow-sm">
            <div class="card-body">
              <h6 class="card-title">Destinations Listed</h6>
              <h2 class="fw-bold">102</h2>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card text-center shadow-sm">
            <div class="card-body">
              <h6 class="card-title">Messages</h6>
              <h2 class="fw-bold">24</h2>
            </div>
          </div>
        </div>
      </div>

      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <h6 class="card-title mb-3">Booking Statistics</h6>
          <canvas id="bookingChart" height="120"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const ctx = document.getElementById('bookingChart').getContext('2d');
  const bookingChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
      datasets: [{
        label: 'Bookings',
        data: [5,10,7,15,9,20,13,5,9,17,11,8],
        borderColor: '#000',
        borderWidth: 1,
        fill: false,
        tension: 0.3
      }]
    },
    options: {
      plugins: { legend: { display: false }},
      scales: {
        y: { beginAtZero: true }
      }
    }
  });
</script>

</body>
</html>
