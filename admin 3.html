<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Add Destination</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style 3.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="d-flex">
  <!-- Sidebar -->
  <nav class="sidebar bg-light p-3">
    <h4 class="text-center fw-bold mb-4">Admin<br>Dashboard</h4>
    <ul class="nav flex-column">
      <li class="nav-item"><a class="nav-link" href="admin 1.html">Dashboard</a></li>
      <li class="nav-item"><a class="nav-link" href="admin 2.html">Manage Users</a></li>
      <li class="nav-item"><a class="nav-link active" href="admin 3.html">Add Destination</a></li>
      <li class="nav-item"><a class="nav-link" href="admin 4.html">View Bookings</a></li>
      <li class="nav-item"><a class="nav-link" href="admin 5.html">Gallery</a></li>
      <li class="nav-item"><a class="nav-link" href="admin 6.html">Contact Messages</a></li>
      <li class="nav-item"><a class="nav-link" href="admin 7.html">Settings / Logout</a></li>
    </ul>
  </nav>

  <!-- Main Content -->
  <div class="flex-grow-1">
    <header class="bg-light shadow-sm p-3 mb-4">
      <h5 class="mb-0">Add Destination</h5>
    </header>

    <div class="form-container container">
      <form name="destinationForm" onsubmit="return validateForm()">

        <label>Destination</label><br>
        <input type="text" id="name" class="form-control mb-3" placeholder="Destination Name">

        <label>Country</label><br>
        <input type="text" id="country" class="form-control mb-3" placeholder="Country/Region">

        <label>Category</label><br>
        <select id="category" class="form-select mb-3">
          <option value="">-- Select Category --</option>
          <option>Beach</option>
          <option>Hill Station</option>
          <option>City</option>
          <option>Adventure</option>
          <option>Cultural</option>
        </select>

        <label>Price</label><br>
        <input type="text" id="price" class="form-control mb-3" placeholder="Price/Cost">

        <label>Description</label><br>
        <textarea id="desc" class="form-control mb-3" placeholder="Description" rows="4"></textarea>

        <label>Upload Images</label><br>
        <input type="file" id="file-upload" accept="image/*" multiple class="form-control mb-3">

        <button type="submit" class="btn btn-dark">Submit</button>
      </form>
    </div>
  </div>
</div>

<script>
function validateForm() {
  var name = document.getElementById("name").value;
  var country = document.getElementById("country").value;
  var category = document.getElementById("category").value;
  var price = document.getElementById("price").value;
  var desc = document.getElementById("desc").value;
  var file = document.getElementById("file-upload").files.length;

  if (name == "") {
    alert("Please enter Destination Name");
    document.getElementById("name").focus();
    return false;
  }

  if (country == "") {
    alert("Please enter Country name");
    document.getElementById("country").focus();
    return false;
  }

  if (category == "") {
    alert("Please select Category");
    document.getElementById("category").focus();
    return false;
  }

  if (price == "") {
    alert("Please enter Price");
    document.getElementById("price").focus();
    return false;
  }

  if (isNaN(price)) {
    alert("Price must be a number");
    document.getElementById("price").focus();
    return false;
  }

  if (desc == "") {
    alert("Please enter Description");
    document.getElementById("desc").focus();
    return false;
  }

  if (file == 0) {
    alert("Please upload at least one image");
    document.getElementById("file-upload").focus();
    return false;
  }

  alert("Destination added successfully!");
  return true;
}
</script>

</body>
</html>
