<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Manage Contacts</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style 6.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

  <div class="d-flex">
  <!-- Sidebar -->
  <nav class="sidebar bg-light p-3">
    <h4 class="text-center fw-bold mb-4">Admin<br>Dashboard</h4>
    <ul class="nav flex-column">
      <li class="nav-item"><a class="nav-link" href="admin 1.html">Dashboard</a></li>
      <li class="nav-item"><a class="nav-link active" href="admin 2.html">Manage Users</a></li>
      <li class="nav-item"><a class="nav-link" href="admin 3.html">Add Destination</a></li>
      <li class="nav-item"><a class="nav-link" href="admin 4.html">View Bookings</a></li>
      <li class="nav-item"><a class="nav-link" href="admin 5.html">Gallery</a></li>
      <li class="nav-item"><a class="nav-link" href="admin 6.html">Contact Messages</a></li>
      <li class="nav-item"><a class="nav-link" href="admin 7.html">Settings / Logout</a></li>
    </ul>
  </nav>

      <div class="flex-grow-1">
    <header class="bg-light shadow-sm p-3 mb-4">
      <h5 class="mb-0">Manage Contacts</h5>
    </header>

        <div class="contact-form-box mx-auto mt-5 p-4">
          <form>
            <div class="mb-3">
              <label class="form-label">Name</label>
              <input type="text" class="form-control" readonly>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" readonly>
            </div>
            <div class="mb-3">
              <label class="form-label">Subject</label>
              <input type="text" class="form-control" readonly>
            </div>
            <div class="mb-3">
              <label class="form-label">Date</label>
              <input type="text" class="form-control" readonly>
            </div>
            <div class="mb-3">
              <label class="form-label">Message</label>
              <textarea class="form-control" rows="4" readonly></textarea>
            </div>

            <div class="d-flex justify-content-between align-items-center">
              <div class="btn-group-vertical">
                <button type="button" class="btn btn-light border mb-2">View</button>
                <button type="button" class="btn btn-light border mb-2">Reply</button>
                <button type="button" class="btn btn-light border">Delete</button>
              </div>
              <div class="arrows">
                <button type="button" class="btn btn-light border me-2">&lt;</button>
                <button type="button" class="btn btn-light border">&gt;</button>
              </div>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>

</body>
</html>
